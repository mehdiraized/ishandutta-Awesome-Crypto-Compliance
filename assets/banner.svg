<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <style>
      .title { font: bold 48px sans-serif; fill: white; }
      .subtitle { font: 24px sans-serif; fill: white; opacity: 0.9; }
      @keyframes pulse { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }
      .dynamic-elem { animation: pulse 2s infinite; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad)" rx="15"/>
  <circle cx="100" cy="100" r="50" fill="white" opacity="0.1" class="dynamic-elem"/>
  <circle cx="700" cy="50" r="30" fill="white" opacity="0.1" class="dynamic-elem" style="animation-delay: 1s;"/>
  <text x="400" y="90" text-anchor="middle" class="title">Awesome Crypto Compliance</text>
  <text x="400" y="140" text-anchor="middle" class="subtitle">Your go-to ecosystem for AML &amp; Compliance Tools</text>
</svg>